<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Conexión Agenda Familia Martell</title></head><body>
<p id="state">Conexión con Agenda Familia Martell. Abrí la agenda desde <a href="https://oscarmartell.github.io/agenda-familia-martell/" target="_top">GitHub</a>.</p>
<script>
const HOST='https://oscarmartell.github.io';
const METHODS=new Set(['logout','listActivities','createActivity','completeActivity','rescheduleActivity']);
let channel='',token='',starting=false;
function send(data){window.top.postMessage({...data,channel},HOST)}
function rpc(name,args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(Error(e.message||'Falló la operación en Familia.')))[name](...args))}
const hello=setInterval(()=>{if(!channel)window.top.postMessage({type:'familia:bridge-hello'},HOST)},500);
window.addEventListener('message',async e=>{
 if(e.origin!==HOST||e.source!==window.top||!e.data)return;
 const d=e.data;
 if(d.type==='familia:bridge-bind'&&!starting&&typeof d.channel==='string'&&d.channel.length===36){
  starting=true;channel=d.channel;clearInterval(hello);
  send({type:'familia:bridge-ready'});return;
 }
 if(d.channel!==channel||d.type!=='familia:bridge-call'||typeof d.id!=='string'||!Array.isArray(d.args))return;
 if(d.name==='login'){
  try{token=await rpc('login',d.args);send({type:'familia:bridge-result',id:d.id,result:true})}catch(err){send({type:'familia:bridge-result',id:d.id,error:err.message})}return;
 }
 if(!METHODS.has(d.name))return;
 if(!token){send({type:'familia:bridge-result',id:d.id,error:'Ingresá el PIN para continuar.'});return}
 try{const result=await rpc(d.name,[token,...d.args]);if(d.name==='logout')token='';send({type:'familia:bridge-result',id:d.id,result})}
 catch(err){send({type:'familia:bridge-result',id:d.id,error:err.message})}
});
</script></body></html>
