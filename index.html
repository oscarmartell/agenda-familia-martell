<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef5e9"><title>Agenda Familia Martell</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;background:#fafbf7;color:#344b45;font:14px system-ui}body{height:100vh;height:100dvh;overflow:hidden}iframe{width:100%;height:100%;display:block;border:0}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#fafbf7;z-index:2;padding:24px}.box{max-width:360px;text-align:center}h1{font-size:20px}p{color:#6b7b73;line-height:1.6}button{background:#dfedda;color:#344b45;border:1px solid #c8dcbf;border-radius:10px;padding:12px 18px;font:inherit;cursor:pointer}.hidden{display:none!important}</style></head><body><div id="loading" role="status"><div class="box"><h1>Agenda Familia Martell</h1><p id="message">Abriendo la agenda…</p><button id="retry" class="hidden" onclick="location.reload()">Volver a intentar</button></div></div><iframe id="agenda" title="Agenda Familia Martell" referrerpolicy="strict-origin-when-cross-origin"></iframe><script src="config.js"></script><script>
const frame=document.getElementById('agenda'),url=window.FAMILY_APP_URL;let connected=false;
const googleOrigin=o=>o==='https://script.google.com'||/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(o);
if(window.top!==window.self){document.getElementById('message').textContent='Abrí esta página directamente en el navegador.';frame.remove()}else if(typeof url==='string'&&/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(url)){
window.addEventListener('message',e=>{if(!googleOrigin(e.origin)||!e.source||!e.data||e.data.type!=='familia:hello'||typeof e.data.nonce!=='string'||!/^[a-z0-9-]{20,80}$/.test(e.data.nonce))return;e.source.postMessage({type:'familia:host-ready',nonce:e.data.nonce},e.origin);connected=true;document.getElementById('loading').classList.add('hidden')});
frame.src=url;setTimeout(()=>{if(!connected){document.getElementById('message').textContent='La agenda todavía no se pudo abrir. Verificá que Apps Script tenga la última versión publicada y acceso para cualquier usuario. Si Google pide iniciar sesión, abrí la app directamente una vez y volvé aquí.';document.getElementById('retry').classList.remove('hidden')}},15000)
}else{document.getElementById('message').textContent='Falta configurar el enlace de Apps Script.'}
</script></body></html>
