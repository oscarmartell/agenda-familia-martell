<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#edf4e7"><title>Agenda Familia Martell</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at top left,#e5f0df,transparent 65%),#faf9f4;color:#354d43;font:15px system-ui,-apple-system,Segoe UI,sans-serif}.card{width:100%;max-width:350px;background:#fffefa;border:1px solid #dfe7d8;border-radius:22px;padding:30px 26px;box-shadow:0 14px 45px #43523c0a}.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:15px;background:#e9e0f2;color:#766184;font-size:22px}h1{font-size:21px;letter-spacing:-.6px;margin:20px 0 8px}p{font-size:13px;color:#748072;line-height:1.6}label{display:block;font-size:12px;margin:24px 0 8px}input{display:block;width:100%;padding:14px;text-align:center;font-size:26px;letter-spacing:12px;border:1px solid #d9e3d2;border-radius:12px;background:#fafcf7;color:#354d43}input:focus{outline:3px solid #dceacd;outline-offset:2px}button{width:100%;min-height:46px;border:1px solid #bed0b1;border-radius:12px;background:#dfebd4;color:#354d43;font:600 14px system-ui;margin-top:14px;cursor:pointer}button:hover{background:#d3e3c6}.status{font-size:12px;color:#8a4b44;min-height:20px;margin-bottom:0}button:disabled{opacity:.6;cursor:wait}</style></head><body><main class="card"><div class="icon" aria-hidden="true">✿</div><h1>Agenda Familia Martell</h1><p>Todos nuestros planes, en un mismo lugar.</p><form id="pinForm"><label for="pin">Ingresá el PIN familiar</label><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" minlength="4" autocomplete="off" placeholder="••••" required aria-describedby="status"><button id="enter" type="submit">Entrar a la agenda →</button></form><p id="status" class="status" role="status" aria-live="polite"></p><noscript>Activá JavaScript para continuar.</noscript></main><script src="config.js"></script><script>
const form=document.getElementById('pinForm'),input=document.getElementById('pin'),status=document.getElementById('status');
form.onsubmit=e=>{e.preventDefault();if(input.value!=='2955'){status.textContent='PIN incorrecto. Probá de nuevo.';input.value='';input.focus();return}const url=window.FAMILY_APP_URL;if(typeof url!=='string'||!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(url)){status.textContent='No se pudo abrir la agenda. Falta configurar su enlace.';return}document.getElementById('enter').disabled=true;status.textContent='Abriendo la agenda…';window.location.assign(url)};
</script></body></html>
